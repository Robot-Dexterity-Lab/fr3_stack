# Workstation-only XR client. The NUC daemon is managed independently.
services:
  vr-teleop:
    profiles: ["vr-teleop"]
    image: ${FR3_TELEOP_IMAGE:-ghcr.io/anthonzh/fr3-xr-teleop@sha256:f6720cf38314e214a1bb9941132b983cc5f9fc39633950a8354af7b1b5d5b1e4}
    network_mode: host
    environment:
      FR3_TELEOP_HOST: "${FR3_TELEOP_HOST:-127.0.0.1}"
    command: ["xhand", "--sim"]
    restart: "no"
