site_name: FR3-STACK
site_url: https://robot-dexterity-lab.github.io/fr3_stack/
site_description: Python and C++ tools for Franka Research 3 control, with Cartesian impedance, hybrid force/position control, and dual-arm coordination.
repo_url: https://github.com/Robot-Dexterity-Lab/fr3_stack
repo_name: Robot-Dexterity-Lab/fr3_stack
edit_uri: edit/main/docs/
docs_dir: ..
site_dir: ../../site
use_directory_urls: false

exclude_docs: |
  requirements.txt
  config/
  docs_backup/

theme:
  name: material
  language: en
  logo: assets/fr3-stack.jpg
  favicon: assets/fr3-stack-transparent.png
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

nav:
  - Overview: index.md
  - Get started:
      - Installation & connection: quickstart.md
      - Troubleshooting: troubleshooting.md
  - Control guides:
      - Single arm: single-arm.md
      - Controllers: controllers.md
      - Joint excitation: joint-sysid.md
      - Dual arm: dual-arm.md
  - Reference:
      - Architecture: architecture.md
      - Wire protocol: wire.md
  - Development:
      - Contributing & verification: development.md
      - Coordination roadmap: dual-arm-coordination-plan.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

extra:
  generator: false

# Math via MathJax (loaded only when arithmatex is used).
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
